name: Test rock upgrade

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix of the artifact(s) holding the packed rock
        type: string
        default: packed-rock

env:
  MAX_HEAP_SIZE: 1024M
  HEAP_NEWSIZE: 512M
  CLUSTER_NAME: Upgrade Test Cluster

jobs:
  test-rock-upgrade:
    name: Rock rolling upgrade test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # for rockcraft.skopeo, which the rock is handed to docker with
      - name: Install rockcraft
        run: sudo snap install rockcraft --classic

      - name: Download rock package(s)
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Load the rock into the docker daemon
        run: |
          rock="$(find . -name '*.rock' -print -quit)"
          if [ -z "${rock}" ]; then
            echo "No .rock file among the downloaded artifacts" >&2
            exit 1
          fi
          echo "Loading ${rock}"

          rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${rock}" docker-daemon:cassandra:test

      - name: Write the readiness helper
        run: |
          cat > "${RUNNER_TEMP}/wait-for-nodes.sh" <<'EOF'
          #!/usr/bin/env bash
          # Waits for nodetool on <container> to report <count> nodes up and
          # normal. Deliberately without "set -e": "grep -c" exits non-zero
          # while the count is still zero.
          set -uo pipefail
          container="$1"
          count="${2:-1}"

          for _ in $(seq 1 60); do
            up="$(docker exec "${container}" nodetool status 2>/dev/null | grep -c '^UN')"
            if [ "${up}" -ge "${count}" ]; then
              docker exec "${container}" nodetool status
              exit 0
            fi
            echo "Waiting for ${count} node(s) to be up and normal, ${up} so far..."
            sleep 10
          done

          echo "Timed out waiting for ${count} node(s)" >&2
          exit 1
          EOF
          chmod +x "${RUNNER_TEMP}/wait-for-nodes.sh"

      - name: Create the network and per-node data volumes
        run: |
          docker network create cassandra-net
          docker volume create cassandra-data1
          docker volume create cassandra-data2
          docker volume create cassandra-data3

      - name: Start the seed of a three node cluster on the upstream image
        run: |
          docker run -d --name cassandra1 --network cassandra-net \
            -v cassandra-data1:/var/lib/cassandra \
            -e CASSANDRA_CLUSTER_NAME="${CLUSTER_NAME}" \
            -e MAX_HEAP_SIZE -e HEAP_NEWSIZE \
            cassandra:5

      # A node that joins while the seed is still initializing gives up rather
      # than retrying, so the other two wait for this.
      - name: Wait for the seed to be up and normal
        run: bash "${RUNNER_TEMP}/wait-for-nodes.sh" cassandra1

      - name: Join a second node
        run: |
          docker run -d --name cassandra2 --network cassandra-net \
            -v cassandra-data2:/var/lib/cassandra \
            -e CASSANDRA_CLUSTER_NAME="${CLUSTER_NAME}" \
            -e CASSANDRA_SEEDS=cassandra1 \
            -e MAX_HEAP_SIZE -e HEAP_NEWSIZE \
            cassandra:5

      - name: Wait for both nodes to be up and normal
        run: bash "${RUNNER_TEMP}/wait-for-nodes.sh" cassandra1 2

      - name: Join a third node
        run: |
          docker run -d --name cassandra3 --network cassandra-net \
            -v cassandra-data3:/var/lib/cassandra \
            -e CASSANDRA_CLUSTER_NAME="${CLUSTER_NAME}" \
            -e CASSANDRA_SEEDS=cassandra1 \
            -e MAX_HEAP_SIZE -e HEAP_NEWSIZE \
            cassandra:5

      - name: Wait for all three nodes to be up and normal
        run: bash "${RUNNER_TEMP}/wait-for-nodes.sh" cassandra1 3

      - name: Write initial data before the upgrade
        run: |
          sleep 30
          docker exec cassandra1 cqlsh -e "
            CREATE KEYSPACE upgrade_test WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 3};
            CREATE TABLE upgrade_test.t1 (id int PRIMARY KEY, message text);
            INSERT INTO upgrade_test.t1 (id, message) VALUES (1, 'hello-pre-upgrade');"

          # Reading at CONSISTENCY ALL needs every replica, so a row that comes
          # back on another node is one that was actually replicated.
          for _ in $(seq 1 12); do
            result="$(docker exec cassandra3 cqlsh \
              -e 'CONSISTENCY ALL; SELECT * FROM upgrade_test.t1;' 2>&1 || true)"
            if echo "${result}" | grep -q hello-pre-upgrade; then
              echo "${result}"
              break
            fi
            sleep 5
          done
          echo "${result}" | grep -q hello-pre-upgrade

      # Each node is stopped, removed and restarted under the same name against
      # its own data volume, with the rock replacing the upstream image but
      # every other flag left exactly as it was at first start.
      - name: Upgrade node 1 to the rock
        run: |
          docker stop cassandra1
          docker rm cassandra1
          docker run -d --name cassandra1 --network cassandra-net \
            -v cassandra-data1:/var/lib/cassandra \
            -e CASSANDRA_CLUSTER_NAME="${CLUSTER_NAME}" \
            -e MAX_HEAP_SIZE -e HEAP_NEWSIZE \
            cassandra:test

      - name: Wait for the cluster to see node 1 back up
        run: bash "${RUNNER_TEMP}/wait-for-nodes.sh" cassandra2 3

      - name: Check the pre-upgrade data survived on node 1
        run: |
          result="$(docker exec cassandra1 cqlsh -e 'SELECT * FROM upgrade_test.t1;')"
          echo "${result}"
          echo "${result}" | grep -q hello-pre-upgrade

      - name: Upgrade node 2 to the rock
        run: |
          docker stop cassandra2
          docker rm cassandra2
          docker run -d --name cassandra2 --network cassandra-net \
            -v cassandra-data2:/var/lib/cassandra \
            -e CASSANDRA_CLUSTER_NAME="${CLUSTER_NAME}" \
            -e CASSANDRA_SEEDS=cassandra1 \
            -e MAX_HEAP_SIZE -e HEAP_NEWSIZE \
            cassandra:test

      - name: Wait for the cluster to see node 2 back up
        run: bash "${RUNNER_TEMP}/wait-for-nodes.sh" cassandra1 3

      - name: Check the pre-upgrade data survived on node 2
        run: |
          result="$(docker exec cassandra2 cqlsh -e 'SELECT * FROM upgrade_test.t1;')"
          echo "${result}"
          echo "${result}" | grep -q hello-pre-upgrade

      - name: Upgrade node 3 to the rock
        run: |
          docker stop cassandra3
          docker rm cassandra3
          docker run -d --name cassandra3 --network cassandra-net \
            -v cassandra-data3:/var/lib/cassandra \
            -e CASSANDRA_CLUSTER_NAME="${CLUSTER_NAME}" \
            -e CASSANDRA_SEEDS=cassandra1 \
            -e MAX_HEAP_SIZE -e HEAP_NEWSIZE \
            cassandra:test

      - name: Wait for the cluster to see node 3 back up
        run: bash "${RUNNER_TEMP}/wait-for-nodes.sh" cassandra1 3

      - name: Check the pre-upgrade data survived on node 3
        run: |
          result="$(docker exec cassandra3 cqlsh -e 'SELECT * FROM upgrade_test.t1;')"
          echo "${result}"
          echo "${result}" | grep -q hello-pre-upgrade

      - name: Write and read back new data on the fully upgraded cluster
        run: |
          docker exec cassandra1 cqlsh -e "
            INSERT INTO upgrade_test.t1 (id, message) VALUES (2, 'hello-post-upgrade');"

          for _ in $(seq 1 12); do
            result="$(docker exec cassandra3 cqlsh \
              -e 'CONSISTENCY ALL; SELECT * FROM upgrade_test.t1;' 2>&1 || true)"
            if echo "${result}" | grep -q hello-post-upgrade; then
              echo "${result}"
              break
            fi
            sleep 5
          done
          echo "${result}" | grep -q hello-post-upgrade

      - name: Dump the container logs
        if: failure()
        run: |
          for container in $(docker ps --all --format '{{.Names}}'); do
            echo "::group::docker logs ${container}"
            docker logs "${container}" 2>&1 || true
            echo "::endgroup::"
          done
