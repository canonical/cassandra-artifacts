name: Build and Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  # Not canonical/data-platform-workflows' lint.yaml, which runs "tox run -e lint":
  # the recipes live in the justfile. Its actionlint job is reproduced here.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install actionlint
        id: actionlint
        run: |
          curl -O https://raw.githubusercontent.com/rhysd/actionlint/main/.github/actionlint-matcher.json
          echo "::add-matcher::actionlint-matcher.json"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: Lint .github/workflows/
        run: |
          '${{ steps.actionlint.outputs.executable }}' -color

      - name: Install just & poetry
        run: |
          pipx install rust-just
          pipx install poetry

      - name: Run linters
        run: just lint

  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v50.2.0

  test-snap:
    name: Test Snap
    needs:
      - lint
      - build
    uses: ./.github/workflows/test-snap.yaml
    with:
      artifact-prefix: ${{ needs.build.outputs.artifact-prefix }}
